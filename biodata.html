<style>
:root{
  --maroon:#8e1212; --gold:#b8892b; --ink:#2a1a1a; --paper:#fffaf3;
  --line:#e7d9bd; --panel:#ffffff; --bg:#f3ede2;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Noto Sans Devanagari','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
.app{display:grid;grid-template-columns:420px 1fr;height:100vh}
/* ---------- form panel ---------- */
.panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:20px 22px 120px}
.panel h1{font-family:'Noto Serif Devanagari',serif;color:var(--maroon);font-size:22px;margin:0 0 4px}
.panel .sub{font-size:13px;color:#7a6a58;margin:0 0 16px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
fieldset{border:1px solid var(--line);border-radius:10px;margin:0 0 14px;padding:12px 14px 6px}
legend{padding:0 8px;font-weight:600;color:var(--maroon);font-size:14px}
label{display:block;font-size:12.5px;color:#5b4a3a;margin:0 0 10px}
label span{display:block;margin-bottom:3px;font-weight:500}
input,textarea,select{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #d9cbb0;border-radius:7px;background:#fffdf9;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
textarea{resize:vertical;min-height:64px}
.photo-row{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.photo-row .thumb{width:62px;height:78px;border:1px dashed #cdb98f;border-radius:6px;background:#fffdf9 center/cover no-repeat;flex:none}
.btn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
.btn.primary{background:var(--maroon);color:#fff}
.btn.primary:hover{background:#6f0c0c}
.btn.ghost{background:#f4ead6;color:#5b3d12}
.btn.ghost:hover{background:#ecdcba}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn[disabled]{opacity:.6;cursor:wait}
.actions{position:sticky;bottom:0;margin:0 -22px -120px;padding:12px 22px;background:linear-gradient(transparent,#fff 30%);display:flex;gap:10px}
.actions .primary{flex:1}
/* ---------- preview ---------- */
.stage{overflow:auto;padding:24px;display:flex;justify-content:center;align-items:flex-start}
.page-wrap{flex:none}

.grid.one{grid-template-columns:1fr}
.r{display:grid;grid-template-columns:40% 1fr;gap:4px;padding:1.5px 0;align-items:baseline}
.r.full{grid-column:1/-1;grid-template-columns:20% 1fr}
.r b{font-weight:600;color:#5a1d1d}
.r b::after{content:" :";}
.r i{font-style:normal;word-break:break-word;white-space:pre-line}
.empty{color:#a89880;text-align:center;margin-top:80px;font-size:1.05em}
@media (max-width:980px){
  .app{grid-template-columns:1fr;height:auto}
  .panel{overflow:visible;border-right:0}
  .stage{padding:12px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>बायोडेटा तयार करा</h1>
    <p class="sub">Fill the details – the page on the right updates live. Empty fields are skipped.</p>

    <div class="row2">
      <label><span>Label language</span>
        <select id="lang"><option value="mr">मराठी</option><option value="hi">हिंदी</option><option value="en">English</option></select>
      </label>
      <label><span>Text size (auto-fit)</span>
        <select id="size"><option value="auto">Auto</option><option value="16">Large</option><option value="14">Medium</option><option value="12">Small</option></select>
      </label>
    </div>

    <fieldset><legend>Photo</legend>
      <div class="photo-row">
        <div class="thumb" id="thumb"></div>
        <div>
          <input type="file" id="photoFile" accept="image/*">
          <button class="btn ghost" id="rmPhoto" style="margin-top:6px;padding:5px 10px;font-size:12px" type="button">Remove photo</button>
        </div>
      </div>
    </fieldset>

    <div id="formHost"></div>

    <div class="actions">
      <button class="btn ghost" id="clearBtn" type="button">Clear</button>
      <button class="btn primary" id="pdfBtn" type="button">Download PDF</button>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="page-wrap" id="wrap">
      <div id="page">
        <div id="content"></div>
      </div>
    </div>
  </main>
</div>

<script>
/* ---------------- field definitions ---------------- */
const L = {
  title:{en:"BIODATA",mr:"बायोडेटा",hi:"बायोडाटा"},
  sections:[
    {id:"p",t:{en:"Personal Details",mr:"वैयक्तिक माहिती",hi:"व्यक्तिगत जानकारी"},top:true,fields:[
      {k:"name",en:"Full Name",mr:"पूर्ण नाव",hi:"पूरा नाम"},
      {k:"dob",en:"Date of Birth",mr:"जन्म तारीख",hi:"जन्म तिथि",type:"date"},
      {k:"tob",en:"Birth Time",mr:"जन्म वेळ",hi:"जन्म समय",type:"time"},
      {k:"pob",en:"Birth Place",mr:"जन्म ठिकाण",hi:"जन्म स्थान"},
      {k:"height",en:"Height",mr:"उंची",hi:"ऊँचाई"},
      {k:"complexion",en:"Complexion",mr:"वर्ण",hi:"रंग"},
      {k:"blood",en:"Blood Group",mr:"रक्तगट",hi:"रक्त समूह"},
      {k:"caste",en:"Caste / Sub-caste",mr:"जात / पोटजात",hi:"जाति / उपजाति"},
      {k:"gotra",en:"Gotra",mr:"गोत्र",hi:"गोत्र"},
      {k:"rashi",en:"Rashi",mr:"रास",hi:"राशि"},
      {k:"nakshatra",en:"Nakshatra",mr:"नक्षत्र",hi:"नक्षत्र"},
      {k:"manglik",en:"Manglik",mr:"मंगळ",hi:"मांगलिक"},
      {k:"diet",en:"Diet",mr:"आहार",hi:"आहार"}
    ]},
    {id:"e",t:{en:"Education & Career",mr:"शिक्षण व करिअर",hi:"शिक्षा व करियर"},fields:[
      {k:"education",en:"Education",mr:"शिक्षण",hi:"शिक्षा",full:1},
      {k:"occupation",en:"Occupation",mr:"व्यवसाय / नोकरी",hi:"व्यवसाय / नौकरी"},
      {k:"company",en:"Company / Workplace",mr:"कामाचे ठिकाण",hi:"कार्यस्थल"},
      {k:"income",en:"Annual Income",mr:"वार्षिक उत्पन्न",hi:"वार्षिक आय"}
    ]},
    {id:"f",t:{en:"Family Details",mr:"कौटुंबिक माहिती",hi:"पारिवारिक जानकारी"},fields:[
      {k:"father",en:"Father's Name",mr:"वडिलांचे नाव",hi:"पिता का नाम"},
      {k:"fatherocc",en:"Father's Occupation",mr:"वडिलांचा व्यवसाय",hi:"पिता का व्यवसाय"},
      {k:"mother",en:"Mother's Name",mr:"आईचे नाव",hi:"माता का नाम"},
      {k:"motherocc",en:"Mother's Occupation",mr:"आईचा व्यवसाय",hi:"माता का व्यवसाय"},
      {k:"brothers",en:"Brothers",mr:"भाऊ",hi:"भाई"},
      {k:"sisters",en:"Sisters",mr:"बहीण",hi:"बहन"},
      {k:"mama",en:"Maternal Uncle (Mama)",mr:"मामा",hi:"मामा"},
      {k:"native",en:"Native Place",mr:"मूळ गाव",hi:"मूल निवास"}
    ]},
    {id:"c",t:{en:"Contact",mr:"संपर्क",hi:"संपर्क"},fields:[
      {k:"mobile",en:"Mobile",mr:"मोबाईल",hi:"मोबाइल"},
      {k:"email",en:"Email",mr:"ईमेल",hi:"ईमेल"},
      {k:"address",en:"Address",mr:"पत्ता",hi:"पता",full:1,area:1}
    ]},
    {id:"x",t:{en:"Expectations",mr:"अपेक्षा",hi:"अपेक्षाएँ"},fields:[
      {k:"expect",en:"Expectations from partner",mr:"जोडीदाराकडून अपेक्षा",hi:"जीवनसाथी से अपेक्षाएँ",full:1,area:1,nolabel:1}
    ]}
  ]
};

const $ = s => document.querySelector(s);
const state = {}; let photo = "";

/* ---------------- build form ---------------- */
const host = $("#formHost");
L.sections.forEach(sec=>{
  const fs = document.createElement("fieldset");
  fs.innerHTML = `<legend>${sec.t.en} <small style="color:#8a7a68;font-weight:400">${sec.t.mr}</small></legend>`;
  const wrap = document.createElement("div");
  wrap.className = "row2";
  sec.fields.forEach(f=>{
    const lb = document.createElement("label");
    if(f.full||f.area) lb.style.gridColumn = "1/-1";
    const tag = f.area ? "textarea" : "input";
    lb.innerHTML = `<span>${f.en}</span><${tag} data-k="${f.k}" ${f.type&&!f.area?`type="${f.type}"`:'type="text"'}></${tag}>`;
    wrap.appendChild(lb);
  });
  fs.appendChild(wrap); host.appendChild(fs);
});
host.addEventListener("input",e=>{
  const k = e.target.dataset.k; if(!k) return;
  state[k] = e.target.value; render();
});

/* ---------------- helpers ---------------- */
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fmt(f,v){
  if(f.type==="date"&&v){const [y,m,d]=v.split("-");return `${d}/${m}/${y}`;}
  if(f.type==="time"&&v){let [h,m]=v.split(":");h=+h;const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${m} ${ap}`;}
  return v;
}

/* ---------------- render preview ---------------- */
function render(){
  const lang = $("#lang").value;
  let top="", rest="", any=false;
  L.sections.forEach(sec=>{
    const rows = sec.fields.filter(f=>(state[f.k]||"").trim()).map(f=>{
      any=true;
      const v = esc(fmt(f,state[f.k].trim()));
      return f.nolabel
        ? `<div class="r full" style="grid-template-columns:1fr"><i>${v}</i></div>`
        : `<div class="r ${f.full?"full":""}"><b>${f[lang]}</b><i>${v}</i></div>`;
    });
    if(!rows.length) return;
    const html = `<div class="sec"><h3>${sec.t[lang]}</h3><div class="grid ${sec.top?"one":""}">${rows.join("")}</div></div>`;
    if(sec.top) top = html; else rest += html;
  });
  const ph = photo ? `<div class="photo on"><img src="${photo}" alt=""></div>` : "";
  $("#content").innerHTML =
    `<div class="title">${L.title[lang]}</div>` +
    (any||photo
      ? `<div class="top"><div class="grow">${top}</div>${ph}</div>${rest}`
      : `<div class="empty">Fill the form to see your biodata here</div>`);
  fit();
}

/* shrink text until it fits inside the frame */
function fit(){
  const c = $("#content"), mode = $("#size").value;
  let s = mode==="auto" ? 16 : +mode;
  c.style.fontSize = s+"px";
  while(c.scrollHeight > c.clientHeight+1 && s > 8){ s -= .5; c.style.fontSize = s+"px"; }
}

/* scale preview to fit the screen */
function scalePage(){
  const stage = $("#stage"), page = $("#page"), wrap = $("#wrap");
  const avail = stage.clientWidth - (innerWidth<=980?24:48);
  const sc = Math.min(1, avail/794, (innerWidth<=980?9:(innerHeight-48)/1123) );
  const s = innerWidth<=980 ? Math.min(1,avail/794) : Math.min(1,avail/794,(innerHeight-48)/1123);
  page.style.transform = `scale(${s})`;
  wrap.style.width = 794*s+"px"; wrap.style.height = 1123*s+"px";
}

/* ---------------- photo ---------------- */
$("#photoFile").addEventListener("change",e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{photo=r.result; $("#thumb").style.backgroundImage=`url(${photo})`; render();};
  r.readAsDataURL(f);
});
$("#rmPhoto").onclick = ()=>{photo=""; $("#photoFile").value=""; $("#thumb").style.backgroundImage=""; render();};

/* ---------------- clear ---------------- */
$("#clearBtn").onclick = ()=>{
  if(!confirm("Clear all fields?")) return;
  document.querySelectorAll("[data-k]").forEach(i=>i.value="");
  Object.keys(state).forEach(k=>delete state[k]);
  $("#rmPhoto").click();
};

/* ---------------- PDF ---------------- */
$("#pdfBtn").onclick = async function(){
  const btn = this; btn.disabled = true; const old = btn.textContent; btn.textContent = "Preparing PDF…";
  try{
    await document.fonts.ready;
    const canvas = await html2canvas($("#page"),{
      scale:2.5, useCORS:true, backgroundColor:"#ffffff",
      onclone:(doc)=>{
        const p = doc.querySelector("#page");
        p.style.transform="none"; p.style.boxShadow="none";
        doc.querySelector("#wrap").style.width="794px";
        doc.querySelector("#wrap").style.height="1123px";
      }
    });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({orientation:"portrait",unit:"mm",format:"a4"});
    pdf.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",0,0,210,297);
    const nm = (state.name||"Biodata").trim().replace(/[^\w\u0900-\u097F]+/g,"_");
    pdf.save(`${nm}_Biodata.pdf`);
  }catch(err){
    alert("Could not create the PDF. Check your internet connection (needed once to load the PDF library) and try again.\n"+err);
  }finally{ btn.disabled=false; btn.textContent=old; }
};

$("#lang").onchange = render; $("#size").onchange = render;
addEventListener("resize",scalePage);
scalePage(); render();
document.fonts && document.fonts.ready.then(render);
</script>
</body>
</html>
